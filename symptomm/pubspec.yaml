name: symptomm
description: Mediora offers general medical specialty guidance based on selected symptoms (not a diagnostic tool).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  geolocator: ^14.1.1
  http: ^1.6.0
  latlong2: ^0.9.1
  shared_preferences: ^2.2.3
  webview_all: ^1.4.4
dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true